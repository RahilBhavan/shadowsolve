[package]
name = "shadowsolve-solver-engine"
version = "0.1.0"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
domain = { package = "shadowsolve-domain", path = "../domain" }
pool-math = { package = "shadowsolve-pool-math", path = "../pool-math" }
state-ingestion = { path = "../state-ingestion" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
