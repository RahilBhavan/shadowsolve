name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Guard against signing surfaces
        run: |
          set -euo pipefail
          if /usr/bin/grep -RInE --exclude='*.md' \
            'private[_-]?key|eth_sendRawTransaction|signTransaction|ethers\.Wallet|web3\.eth\.accounts' \
            src crates research tests scripts; then
            echo 'Forbidden signing/wallet patterns found' >&2
            exit 1
          fi
          echo 'No signing/wallet patterns found'
      - name: Run Rust checks
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check --workspace --locked
          cargo test --workspace --locked
      - name: Run fixture and shell checks
        run: |
          python3 tests/mock_rpc.py --self-check
          bash -n tests/e2e-shadow-stack.sh
          bash -n scripts/migrate-postgres.sh
          python3 scripts/verify-pinned-pool.py --self-check
      - name: Run Python checks
        run: python3 -m pytest
      - name: Run JavaScript checks
        run: |
          node src/self-check.js
          for f in src/*.js; do node --check "$f"; done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit Cargo.lock against RustSec advisories
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Docker Compose E2E
        run: |
          cp .env.example .env
          bash tests/e2e-shadow-stack.sh
