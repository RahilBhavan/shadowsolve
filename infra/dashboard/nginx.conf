limit_req_zone $binary_remote_addr zone=solve_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=notify_limit:10m rate=5r/s;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 256k;
  proxy_connect_timeout 3s;
  proxy_send_timeout 10s;
  proxy_read_timeout 30s;
  error_page 403 =405 @method_not_allowed;

  location @method_not_allowed { return 405; }

  location = /api/dashboard {
    limit_except GET { deny all; }
    proxy_pass http://solver:8080/api/dashboard;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location = /health {
    limit_except GET { deny all; }
    proxy_pass http://solver:8080/health;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location = /ready {
    limit_except GET { deny all; }
    proxy_pass http://solver:8080/ready;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location = /metrics {
    limit_except GET { deny all; }
    proxy_pass http://solver:8080/metrics;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location = /solve {
    limit_req zone=solve_limit burst=10 nodelay;
    limit_except POST { deny all; }
    proxy_pass http://solver:8080/solve;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location = /notify {
    limit_req zone=notify_limit burst=5 nodelay;
    limit_except POST { deny all; }
    proxy_pass http://solver:8080/notify;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
